rx="9" fill="#f0eafb" stroke="#bda8da" stroke-width="1.4"/><text x="851" y="566.0" font-size="17" fill="#593a7e" font-weight="650">Signals</text><rect x="835" y="589" width="249" height="34" rx="9" fill="#f0eafb" stroke="#bda8da" stroke-width="1.4"/><text x="851" y="611.0" font-size="17" fill="#593a7e" font-weight="650">Knowledge base</text><rect x="835" y="634" width="249" height="34" rx="9" fill="#f0eafb" stroke="#bda8da" stroke-width="1.4"/><text x="851" y="656.0" font-size="17" fill="#593a7e" font-weight="650">CRM integration</text><rect x="835" y="679" width="249" height="34" rx="9" fill="#f0eafb" stroke="#bda8da" stroke-width="1.4"/><text x="851" y="701.0" font-size="17" fill="#593a7e" font-weight="650">Email drafting</text><path d="M816 615 H785" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>