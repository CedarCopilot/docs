<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="900" viewBox="0 0 1140 900" role="img" aria-labelledby="title desc"><title id="title">Cedar as the brain — from context to rep action</title><desc id="desc">Read upward from connected data through context, sales strategy and agent execution. Agents use capabilities to create outputs, organized in Task Views and Conversation Overview. Reps work in Cedar, Slack or an MCP client.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#687672" stroke-width="1.4"/></marker></defs><rect width="1140" height="900" rx="16" fill="#fafbf9"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="55" font-size="34" fill="#20392c" font-weight="700">Cedar as the brain</text><text x="39" y="82" font-size="18" fill="#4c6356" font-weight="400">From connected data to the places reps take action</text><path d="M278 240 V214 H927" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round"/><path d="M860 240 V214" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round"/><path d="M278 214 H209 V190" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M569 214 V190" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M927 214 V190" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="38" y="125" width="336" height="64" rx="9" fill="#fff0df" stroke="#dba976" stroke-width="1.4"/><text x="54" y="150" font-size="17" fill="#79431a" font-weight="650">Cedar UI</text><text x="54" y="173" font-size="14" fill="#79431a" font-weight="400">Review outputs and manage work</text><rect x="402" y="125" width="336" height="64" rx="9" fill="#fff0df" stroke="#dba976" stroke-width="1.4"/><text x="418" y="150" font-size="17" fill="#79431a" font-weight="650">Slack</text><text x="418" y="173" font-size="14" fill="#79431a" font-weight="400">Act on a task from its channel</text><rect x="766" y="125" width="336" height="64" rx="9" fill="#fff0df" stroke="#dba976" stroke-width="1.4"/><text x="782" y="150" font-size="17" fill="#79431a" font-weight="650">Agents via MCP</text><text x="782" y="173" font-size="14" fill="#79431a" font-weight="400">Claude, Codex, ChatGPT and other clients</text><text x="38" y="115" font-size="16" fill="#5a4a38" font-weight="650">Where reps work</text><rect x="38" y="240" width="500" height="68" rx="9" fill="#eaf2fc" stroke="#9db9d8" stroke-width="1.4"/><text x="54" y="265" font-size="17" fill="#254c73" font-weight="650">Task Views</text><text x="54" y="288" font-size="14" fill="#254c73" font-weight="400">Owned work, priorities, prepared drafts and task status</text><rect x="560" y="240" width="542" height="68" rx="9" fill="#eaf2fc" stroke="#9db9d8" stroke-width="1.4"/><text x="576" y="265" font-size="17" fill="#254c73" font-weight="650">Conversation Overview</text><text x="576" y="288" font-size="14" fill="#254c73" font-weight="400">Files and findings alongside the deal they describe</text><path d="M330 366 V330 H278 V309" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M590 366 V330 H860 V309" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="38" y="366" width="745" height="172" rx="12" fill="#f3f5f2" stroke="#c4cdc5"/><text x="55" y="392" font-size="17" fill="#35493d" font-weight="650">Agent outputs</text><rect x="55" y="404" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="71" y="425.5" font-size="17" fill="#283d31" font-weight="650">Message drafts</text><rect x="295" y="404" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="311" y="425.5" font-size="17" fill="#283d31" font-weight="650">Workflow documents</text><rect x="535" y="404" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="551" y="425.5" font-size="17" fill="#283d31" font-weight="650">Reports and coaching</text><rect x="55" y="446" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="71" y="467.5" font-size="17" fill="#283d31" font-weight="650">HTML deal rooms</text><rect x="295" y="446" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="311" y="467.5" font-size="17" fill="#283d31" font-weight="650">Cedar tables</text><rect x="535" y="446" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="551" y="467.5" font-size="17" fill="#283d31" font-weight="650">Org charts and maps</text><rect x="55" y="488" width="226" height="33" rx="9" fill="#fff" stroke="#c8d1cb" stroke-width="1.4"/><text x="71" y="509.5" font-size="17" fill="#283d31" font-weight="650">Documents and briefs</text><path d="M474 585 V540" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="270" y="585" width="513" height="60" rx="9" fill="#dcefe4" stroke="#84b399" stroke-width="1.4"/><text x="286" y="610" font-size="17" fill="#21553c" font-weight="650">3   Agent execution</text><text x="286" y="633" font-size="14" fill="#21553c" font-weight="400">Runs on events, schedules or a request</text><rect x="38" y="585" width="202" height="60" rx="9" fill="#dcefe4" stroke="#84b399" stroke-width="1.4"/><text x="54" y="610" font-size="17" fill="#21553c" font-weight="650">Internal agents</text><text x="54" y="633" font-size="14" fill="#21553c" font-weight="400">Sales-specific agents</text><path d="M241 615 H268" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M474 677 V647" fill="none" stroke="#687672" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M474 758 V735" fill="